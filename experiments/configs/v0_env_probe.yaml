experiment_id: v0_env_probe
version: v0
runtime: vllm
model: null
arm: env_probe

workload:
  prompt: Respond with the exact text 'smoke ok'.
  temperature: 0.0
  max_tokens: 64
  timeout_s: 30.0

preemption_policy:
  mode: auto
  response_replayed: false

resource_delta: {}
telemetry: {}

output_dir: experiments/results/v0_env_probe
seed: 0

runtime_options:
  vllm:
    external_server:
      enabled: false
      base_url: null
    docker_server:
      enabled: false
      image: vllm/vllm-openai:latest
      port: 8000
      container_name: null
      extra_args: []
      model: null

probe_options:
  hardware:
    timeout_s: 5.0
  docker:
    timeout_s: 5.0
  criu:
    timeout_s: 10.0
  docker_criu_integration:
    timeout_s: 60.0
    checkpoint_name: ai-edge-v0-criu-checkpoint
    smoke_image: busybox:1.36
    smoke_runtime: runc
  cuda:
    timeout_s: 120.0
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
  mps:
    timeout_s: 5.0
    allow_start_stop: false
    control_binary: nvidia-cuda-mps-control
    control_pipe_path: /tmp/nvidia-mps/control
  runtime:
    timeout_s: 180.0
  preemption:
    timeout_s: 180.0
    checkpoint_name: ai-edge-v0-criu-checkpoint
