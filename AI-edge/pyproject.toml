[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-runtime-experiments"
version = "0.1.0"
description = "V0 experiment harness for AI runtime checkpoint/resume research."
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "experiments/src"}

[tool.setuptools.packages.find]
where = ["experiments/src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["experiments/tests"]
markers = [
    "integration: integration tests (opt-in with AI_EDGE_RUN_INTEGRATION=1; may require Docker/host tools)",
    "gpu: GPU tests (opt-in with AI_EDGE_RUN_GPU=1; may require CUDA-capable hardware)",
]

[tool.pyright]
extraPaths = ["experiments/src"]
